<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="fire_safety_guide">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>fire_safety_guide</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script>
    // App Version Configuration
    window.APP_VERSION = '1.1.4';
    console.log('Booting Fire Safety Guide (v' + window.APP_VERSION + ')...');

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        // Register without dynamic query param to avoid registration loops
        navigator.serviceWorker.register('flutter_service_worker.js?v=1.1.4')
          .then(function (reg) {
            reg.onupdatefound = function () {
              const worker = reg.installing;
              worker.onstatechange = function () {
                if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('New update available (v' + window.APP_VERSION + '). Please restart the app.');
                  alert('새로운 업데이트가 있습니다! 브라우저를 다시 시작하여 적용해 주세요. (v1.1.4)');
                }
              };
            };
          });
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=1.1.4" async></script>
</body>

</html>
